ignoreGeneratedHeader = true
severity = "error"
confidence = 0.5
errorCode = 2
warningCode = 1

enableAllRules = false
enableDefaultRules = true

[rule."lint/complexity/noExcessiveArguments"]
    severity="warning"
    exclude=["excluded/file.go"]
    arguments=[4]

[rule."lint/style/noBlankImport"]
    disabled=true

[rule."lint/style/useExportedComment"]
    severity="error"
    exclude=["excluded/file-exported.go"]
    arguments=["check-private-receivers", "disable-stuttering-check"]
