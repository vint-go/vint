settings:
    lint/style/noRepeatedNumbers:
        max: 100
        min: 2
        min-occurrences: 2
    lint/style/noRepeatedStrings:
        ignore-calls: false
        ignore-strings: ^(test|debug)$
        ignore-tests: true
        min-length: 5
        min-occurrences: 2
    lint/suspicious/noDuplicateConstants: {}
    lint/suspicious/useMatchingConstant: {}
